name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secret is required: the database is a disposable service container and the
# secrets below are fictitious values used only to let the build run.
jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://dashboard:dashboard@localhost:5432/dashboard?schema=public
      AUTH_SECRET: ci-only-fictitious-secret-value-not-used-in-production
      AUTH_TRUST_HOST: "true"
      INTEGRATION_ENCRYPTION_KEY: Y2ktb25seS1maWN0aXRpb3VzLWtleS0zMi1ieXRlcy0=
      NEXT_PUBLIC_DEFAULT_CURRENCY: EUR
      NEXT_PUBLIC_DEFAULT_TIME_ZONE: Europe/Paris

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Apply migrations on a fresh database
        run: npm run db:deploy

      # M7-06: a fresh stack must come out of the seed usable, and the seed runs on
      # every `up`, so a second run must add nothing. The database service above is
      # throwaway and every value here is fictitious.
      - name: Seed twice on a fresh database
        env:
          SEED_OWNER_EMAIL: owner@example.test
          SEED_OWNER_PASSWORD: Fictitious-Seed-Password-2026
          SEED_OWNER_NAME: Proprietaire fictif
          SEED_OWNER_FORCE_PASSWORD: "false"
          SEED_WORKSPACE_NAME: Personnel
          SEED_WORKSPACE_MODULES: budget,real-estate,development
        run: |
          npm run db:seed
          npm run db:seed
          npm run db:seed:check

      - name: Build
        run: npm run build

  # SO-04: a backup counts as verified only once it has been restored. This job dumps a
  # throwaway database seeded with fictitious data, restores it into another throwaway
  # container, and checks that corrupt archives are rejected. The dumps stay in a
  # temporary directory and are never uploaded as artifacts.
  backup-restore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Backup, verify and reject corrupt archives
        run: ./infra/backups/test-backup-cycle.sh
