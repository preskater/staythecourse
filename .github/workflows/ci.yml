name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secret is required: the database is a disposable service container and the
# secrets below are fictitious values used only to let the build run.
jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://dashboard:dashboard@localhost:5432/dashboard?schema=public
      AUTH_SECRET: ci-only-fictitious-secret-value-not-used-in-production
      AUTH_TRUST_HOST: "true"
      INTEGRATION_ENCRYPTION_KEY: Y2ktb25seS1maWN0aXRpb3VzLWtleS0zMi1ieXRlcy0=
      NEXT_PUBLIC_DEFAULT_CURRENCY: EUR
      NEXT_PUBLIC_DEFAULT_TIME_ZONE: Europe/Paris
      # Fictitious owner for the seed steps below. Never a real address or password.
      SEED_OWNER_EMAIL: owner@example.test
      SEED_OWNER_PASSWORD: Fictitious-Password-2026
      SEED_OWNER_NAME: Proprietaire fictif
      SEED_WORKSPACE_MODULES: budget,real-estate,development

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Apply migrations on a fresh database
        run: npm run db:deploy

      # M7-06: the seed runs on every `up`. A second run must add nothing, and the
      # check proves one owner, one personal workspace with an OWNER membership and the
      # selected module rows.
      - name: Seed twice and check idempotency
        run: |
          npm run db:seed
          npm run db:seed
          npm run db:verify-seed

      - name: Build
        run: npm run build

      # M7-06 boot check: the seeded database must serve the sign-in page, keep the
      # dashboard guarded without a session, and let the seeded owner in.
      - name: Boot check on the seeded stack
        run: |
          ./node_modules/.bin/next start > /tmp/dashboard-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/login && break
            sleep 1
          done

          curl -sf -o /dev/null -w '/login %{http_code}\n' http://127.0.0.1:3000/login
          ANONYMOUS="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard)"
          echo "/dashboard (signed out) $ANONYMOUS"
          [ "$ANONYMOUS" = "307" ] || { echo "FAIL: /dashboard must redirect a signed-out visitor"; cat /tmp/dashboard-start.log; exit 1; }

          COOKIES="$(mktemp)"
          CSRF="$(curl -s -c "$COOKIES" http://127.0.0.1:3000/api/auth/csrf | sed 's/.*"csrfToken":"\([^"]*\)".*/\1/')"
          SIGN_IN="$(curl -s -b "$COOKIES" -c "$COOKIES" -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/auth/callback/credentials \
            --data-urlencode "csrfToken=$CSRF" \
            --data-urlencode "email=$SEED_OWNER_EMAIL" \
            --data-urlencode "password=$SEED_OWNER_PASSWORD" \
            --data-urlencode "callbackUrl=http://127.0.0.1:3000/dashboard")"
          echo "sign-in $SIGN_IN"
          [ "$SIGN_IN" = "302" ] || { echo "FAIL: the seeded owner cannot sign in"; cat /tmp/dashboard-start.log; exit 1; }

          curl -sf -b "$COOKIES" -o /dev/null -w '/dashboard (signed in) %{http_code}\n' http://127.0.0.1:3000/dashboard

  # SO-04: a backup counts as verified only once it has been restored. This job dumps a
  # throwaway database seeded with fictitious data, restores it into another throwaway
  # container, and checks that corrupt archives are rejected. The dumps stay in a
  # temporary directory and are never uploaded as artifacts.
  backup-restore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Backup, verify and reject corrupt archives
        run: ./infra/backups/test-backup-cycle.sh
